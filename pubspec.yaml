name: namer_app
description: A new Flutter project.

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.2+2

environment:
  sdk: ^3.1.1

dependencies:
  flutter:
    sdk: flutter
  googleapis_auth: ^1.0.0
  firebase_core: ^3.8.0
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.6
  image_picker: ^1.1.2
  english_words: ^4.0.0
  provider: ^6.0.0
  http: ^1.2.2
  google_generative_ai: ^0.4.6
  google_sign_in: ^6.2.1
  flutter_markdown: ^0.7.4+1
  firebase_auth: ^5.3.1
  firebase_app_check: ^0.3.1+3
  font_awesome_flutter: ^10.7.0
  flutter_native_splash: ^2.4.2
  lottie: ^3.1.3
  flutter_launcher_icons: ^0.14.1
  animated_text_kit: ^4.2.1
  file_picker: ^8.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/shirmp.png"
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/icon/app_icon.jpg
    - assets/icon/pikachu.png
    - assets/icon/buble.png
    - assets/icon/shirmp.png
    - assets/icon/shirmp_splash.png
    - assets/icon/shirmp_removebng.png
    - assets/pic1.jpg
    - assets/pic2.jpg
    - assets/pic3.jpg
    - assets/avatar.jpg
flutter_native_splash:
  color: "#2d4665"  # Màu nền cho splash screen
  image: assets/icon/shirmp_removebng.png  # Hình ảnh splash screen cho chế độ sáng
  color_dark: "#2d4665"  # Màu nền cho chế độ tối
  image_dark: assets/icon/shirmp_removebng.png # Hình ảnh splash screen cho chế độ tối
  android_12:
    image: assets/icon/shirmp_removebng.png # Hình ảnh cho Android 12
    color: "#2d4665"  # Màu nền cho Android 12
  fullscreen: true  # Bật chế độ toàn màn hình
  web: false  # Không sử dụng splash screen cho web
