name: namer_app
description: A new Flutter project.

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.1.2+3

environment:
  sdk: ^3.1.1

dependencies:
  flutter:
    sdk: flutter
  googleapis_auth: ^2.0.0
  firebase_core: ^4.1.1
  cloud_firestore: ^6.0.2
  firebase_storage: ^13.0.2
  image_picker: ^1.1.2
  english_words: ^4.0.0
  provider: ^6.0.0
  http: ^1.2.2
  google_generative_ai: ^0.4.6
  google_sign_in: ^7.2.0
  flutter_markdown: ^0.7.4+1
  firebase_auth: ^6.1.0
  firebase_app_check: ^0.4.1
  font_awesome_flutter: ^10.7.0
  flutter_native_splash: ^2.4.7
  lottie: ^3.1.3
  flutter_launcher_icons: ^0.14.1
  animated_text_kit: ^4.2.1
  file_picker: ^10.3.3
  loading_animation_widget: 1.3.0
  animated_hint_textfield: ^1.0.0
  pointycastle: ^3.9.1
  flutter_secure_storage: 9.2.4
  encrypt: ^5.0.3
  basic_utils: ^5.7.0
  uuid: ^4.5.1
  web_socket_channel: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/shirmp.png"
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/icon/shirmp.png
    - assets/icon/shirmp_removebng.png
    - assets/pic1.jpg
    - assets/pic2.jpg
    - assets/pic3.jpg
    - assets/pic4.jpg
    - assets/pic5.jpg
    - assets/pic6.jpg
    - assets/pic7.jpg
    - assets/splash.gif
    - assets/avatar.jpg
flutter_native_splash:
  color: "#FFF0DB"  # Màu nền cho splash screen
  image: assets/icon/shirmp_removebng.png  # Hình ảnh splash screen cho chế độ sáng
  color_dark: "#FFF0DB"  # Màu nền cho chế độ tối
  image_dark: assets/icon/shirmp_removebng.png # Hình ảnh splash screen cho chế độ tối
  android_12:
    image: assets/icon/shirmp_removebng.png # Hình ảnh cho Android 12
    color: "#FFF0DB"  # Màu nền cho Android 12
  fullscreen: true  # Bật chế độ toàn màn hình
  web: false  # Không sử dụng splash screen cho web
